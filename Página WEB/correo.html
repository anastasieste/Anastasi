<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#050505">
  <meta name="referrer" content="no-referrer">
  <title>Confirmar cambio de correo · Anástasi</title>
  <link rel="icon" href="assets/images/branding/Chango2.png" type="image/png">
  <link rel="stylesheet" href="css/styles.css?v=1.3">
  <script type="module" src="js/account-page.js"></script>
</head>
<body>
  <header class="header">
    <a class="brand" href="./" aria-label="Anástasi, inicio"><img src="assets/images/branding/Chango2.png" alt="" width="52" height="52"><span>ANÁSTASI</span></a>
    <a class="account-return" href="perfil.html#general">Volver a Mi perfil</a>
  </header>
  <main class="account-page">
    <div class="account-card">
      <p class="eyebrow">ANÁSTASI · PORTAL MIEMBROS</p>
      <h1>Confirma el cambio de correo</h1>
      <p class="account-intro">Si recibiste un enlace en ambas direcciones, confirma los dos.</p>
      <form id="email-change-confirmation" class="account-form" method="post">
        <button type="submit" class="account-submit" disabled>Confirmar cambio</button>
        <p class="form-message" role="status"></p>
      </form>
      <p class="account-notice" data-account-notice>El servicio de cuentas todavía no está conectado.</p>
    </div>
  </main>
</body>
</html>
