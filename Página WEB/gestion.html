<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#050505">
  <meta name="referrer" content="no-referrer">
  <title>Panel Admin · Anástasi</title>
  <link rel="icon" href="assets/images/branding/Chango2.png" type="image/png">
  <link rel="stylesheet" href="css/styles.css?v=1.16">
  <link rel="stylesheet" href="css/editor.css?v=1.14">
  <script type="module" src="js/management.js?v=1.14"></script>
</head>
<body>
  <a class="skip-link" href="#contenido">Saltar al contenido</a>
  <header class="header member-header">
    <a class="brand" href="./" aria-label="Anástasi, inicio"><img src="assets/images/branding/Chango2.png" alt="" width="52" height="52"><span>ANÁSTASI</span></a>
    <button type="button" class="members-link">Portal Miembros</button>
  </header>
  <main id="contenido" class="member-page">
    <p class="eyebrow">ANÁSTASI · ADMINISTRACIÓN</p>
    <h1>Panel Admin</h1>
    <p id="management-status" role="status">Comprobando sesión…</p>
    <a class="account-submit member-page-signin" href="./#gestion" id="management-signin" hidden>Abrir Portal Miembros</a>
    <div class="admin-layout" id="management-controls" hidden>
      <div class="admin-views video-admin-tabs" role="group" aria-label="Secciones del Panel Admin">
        <button type="button" aria-pressed="true" aria-controls="solicitudes admin-members-section" data-admin-section="members">Miembros y solicitudes</button>
        <button type="button" aria-pressed="false" aria-controls="admin-video-section" data-admin-section="videos">Contenido para revisión</button>
      </div>
      <section class="member-panel" id="solicitudes" aria-labelledby="applications-title">
        <div class="admin-section-heading">
          <h2 id="applications-title">Solicitudes</h2>
          <div class="admin-views" role="group" aria-label="Ver solicitudes">
            <button type="button" data-application-view="pending" aria-pressed="true" aria-controls="applications-pending">Pendientes</button>
            <button type="button" data-application-view="history" aria-pressed="false" aria-controls="applications-history">Historial</button>
          </div>
        </div>
        <div id="applications-pending">
          <p class="application-message" role="status"></p>
          <div class="application-list"></div>
        </div>
        <div id="applications-history" hidden>
          <p class="history-status" role="status"></p>
          <div class="history-list"></div>
        </div>
      </section>
      <section class="member-panel" id="admin-members-section" aria-labelledby="management-title">
        <div class="admin-section-heading">
          <h2 id="management-title">Gestión de miembros</h2>
          <label class="admin-filter">Buscar miembro <input type="search" id="management-filter" placeholder="Callsign o nombre"></label>
        </div>
        <p id="management-members-status" role="status"></p>
        <div id="management-members" class="admin-member-list"></div>
      </section>
      <section class="member-panel" id="admin-video-section" aria-labelledby="video-review-title" hidden>
        <h2 id="video-review-title">Contenido para revisión</h2>
        <p id="admin-video-status" role="status"></p>
        <div id="admin-video-list" class="video-review-list"></div>
      </section>
    </div>
    <dialog id="video-decision" class="video-notice" aria-labelledby="video-decision-title" aria-describedby="video-decision-description">
      <h2 id="video-decision-title"></h2>
      <p id="video-decision-description"></p>
      <form method="dialog" class="video-actions">
        <button class="account-submit" value="cancel" autofocus>Cancelar</button>
        <button class="account-submit video-primary" id="video-decision-confirm" value="confirm"></button>
      </form>
    </dialog>
  </main>
</body>
</html>
