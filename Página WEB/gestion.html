<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#050505">
  <meta name="referrer" content="no-referrer">
  <title>Gestión de miembros · Anástasi</title>
  <link rel="icon" href="assets/images/branding/Chango2.png" type="image/png">
  <link rel="stylesheet" href="css/styles.css?v=1.4">
  <script type="module" src="js/management.js"></script>
</head>
<body>
  <a class="skip-link" href="#contenido">Saltar al contenido</a>
  <header class="header member-header">
    <a class="brand" href="./" aria-label="Anástasi, inicio"><img src="assets/images/branding/Chango2.png" alt="" width="52" height="52"><span>ANÁSTASI</span></a>
    <button type="button" class="members-link">Portal Miembros</button>
  </header>
  <main id="contenido" class="member-page">
    <p class="eyebrow">ANÁSTASI · ADMINISTRACIÓN</p>
    <h1>Gestión de miembros</h1>
    <p id="management-status" role="status">Comprobando sesión…</p>
    <a class="account-submit member-page-signin" href="./#gestion" id="management-signin" hidden>Abrir Portal Miembros</a>
    <div class="member-panel" id="management-controls" hidden>
      <p>Prepara los cambios en la hoja privada, marca <strong>Aplicar</strong> en las filas correspondientes y vuelve aquí para revisarlos.</p>
      <div class="member-actions management-actions">
        <a class="account-submit member-page-signin" id="management-sheet" target="_blank" rel="noopener" hidden>Abrir Google Sheets</a>
        <button type="button" class="dialog-close" id="management-sync">Actualizar hoja</button>
        <button type="button" class="account-submit" id="management-preview">Revisar cambios</button>
      </div>
      <section class="member-panel management-review" id="management-review" aria-labelledby="management-review-title" hidden>
        <h2 id="management-review-title">Cambios por aplicar</h2>
        <ul id="management-changes"></ul>
        <div class="confirmation-actions">
          <button type="button" class="account-submit" id="management-apply">Aplicar cambios</button>
          <button type="button" class="dialog-close" id="management-cancel">Cancelar</button>
        </div>
      </section>
    </div>
  </main>
</body>
</html>
