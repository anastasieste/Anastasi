<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#050505">
  <meta name="referrer" content="no-referrer">
  <title>Crear Cuenta · Anástasi</title>
  <link rel="icon" href="assets/images/branding/Chango2.png" type="image/png">
  <link rel="stylesheet" href="css/styles.css?v=1.2">
  <script type="module" src="js/account-page.js"></script>
</head>
<body>
  <header class="header">
    <a class="brand" href="./" aria-label="Anástasi, inicio"><img src="assets/images/branding/Chango2.png" alt="" width="52" height="52"><span>ANÁSTASI</span></a>
    <a class="account-return" href="./#portal">Volver al portal</a>
  </header>
  <main class="account-page">
    <div class="account-card">
      <p class="eyebrow">ANÁSTASI · PORTAL MIEMBROS</p>
      <h1>Crear Cuenta</h1>
      <p class="account-intro">Completa tus datos y confirma tu correo. Un administrador revisará tu solicitud y te enviará la decisión.</p>
      <form id="registration-form" class="account-form" method="post">
        <label>Nombre y Apellido
          <input name="full_name" autocomplete="name" required minlength="3" maxlength="100">
        </label>
        <label>Callsign
          <input name="callsign" autocomplete="username" autocapitalize="off" spellcheck="false" required minlength="2" maxlength="32" pattern="[A-Za-z0-9][A-Za-z0-9._\-]{1,31}" aria-describedby="callsign-rule">
          <small id="callsign-rule">Usa letras, números, guiones, puntos o guiones bajos.</small>
        </label>
        <label>Contraseña
          <input name="password" type="password" autocomplete="new-password" required minlength="9" maxlength="72" aria-describedby="password-rule">
          <small id="password-rule">Usa al menos 9 caracteres, una mayúscula, una minúscula, un número y un símbolo.</small>
        </label>
        <label>Confirmación de contraseña
          <input name="confirmation" type="password" autocomplete="new-password" required maxlength="72">
        </label>
        <label>Correo electrónico
          <input name="email" type="email" autocomplete="email" required maxlength="254">
        </label>
        <label>Clan
          <select name="squad" required><option value="">Selecciona tu clan</option></select>
        </label>
        <button type="submit" class="account-submit" disabled>Crear Cuenta</button>
        <p class="form-message" role="status"></p>
      </form>
      <form id="confirmation-form" class="account-form" method="post" hidden>
        <button type="submit" class="account-submit" disabled>Confirmar mi correo</button>
        <p class="form-message" role="status"></p>
      </form>
      <p class="account-notice" data-account-notice>El servicio de cuentas todavía no está conectado.</p>
    </div>
  </main>
</body>
</html>
