<!doctype html><html lang="es"><meta charset="utf-8"><title>Validación de Anástasi</title><style>body{font:16px system-ui;max-width:900px;margin:30px auto}#fixture{height:160px;overflow:hidden}.carousel-stage img{width:30px}.carousel-card{display:inline-block}.reflection{display:none}.pass{color:#17662d}.fail{color:#ac1020}</style><h1>Validación del carrusel</h1><p id="summary">Ejecutando…</p><div id="fixture"></div><ol id="results"></ol><script type="module">
import { CinematicCarousel } from '../Página WEB/js/components/carousel.js';
const fixture = document.querySelector('#fixture');
const results = document.querySelector('#results');
let passes = 0, failures = 0;
const delay = ms => new Promise(resolve => setTimeout(resolve, ms));
function check(condition, message) { const li = document.createElement('li'); li.className = condition ? 'pass' : 'fail'; li.textContent = `${condition ? 'OK' : 'ERROR'} · ${message}`; results.append(li); condition ? passes++ : failures++; }
function create(count, duration = 0) {
  fixture.innerHTML = '<div class="carousel" tabindex="0"><div class="carousel-stage"><button class="carousel-arrow" data-carousel="previous">Anterior</button><button class="carousel-arrow" data-carousel="next">Siguiente</button></div><p class="carousel-status"></p></div>';
  return new CinematicCarousel(fixture.firstElementChild, Array.from({length:count}, (_,i)=>({src:'../Página WEB/assets/images/carousel/demo-01.svg',alt:`Prueba ${i}`})),{interval:1500,duration});
}
try {
  for (const count of [0,1,2,3,7]) {
    const carousel = create(count);
    check(fixture.querySelectorAll('.carousel-card').length === (count ? 5 : 0), `${count} imágenes: cantidad de elementos acotada`);
    if (!count) check([...fixture.querySelectorAll('.carousel-arrow')].every(button=>button.hidden), `${count} imágenes: controles ocultos`);
    else {
      let valid = true;
      for (let i=0;i<count*3;i++) {
        carousel.move(1,true);
        const center = fixture.querySelector('[data-position="0"]');
        valid &&= center.querySelector('.slide-image').alt === `Prueba ${(i+1)%count}` && !center.inert;
      }
      check(valid && carousel.index===0, `${count} imágenes: tres ciclos sin pérdida de contenido`);
      carousel.move(-1,true);
      check(fixture.querySelector('[data-position="0"] img').alt===`Prueba ${count-1}`, `${count} imágenes: vuelta inversa`);
      check([...fixture.querySelectorAll('.carousel-card')].filter(card=>Math.abs(Number(card.dataset.position))>1).every(card=>card.inert), `${count} imágenes: contenido oculto fuera del foco`);
      fixture.querySelector('[data-carousel="next"]').click();
      check(carousel.index===0, `${count} imágenes: control siguiente`);
      carousel.root.dispatchEvent(new KeyboardEvent('keydown',{key:'ArrowLeft',bubbles:true}));
      check(carousel.index===count-1, `${count} imágenes: teclado`);
      carousel.stage.dispatchEvent(new PointerEvent('pointerdown',{pointerId:1,clientX:200,clientY:50,button:0,isPrimary:true,pointerType:'touch'}));
      window.dispatchEvent(new PointerEvent('pointerup',{pointerId:1,clientX:100,clientY:55}));
      check(carousel.index===0, `${count} imágenes: gesto horizontal`);
      carousel.stage.dispatchEvent(new PointerEvent('pointerdown',{pointerId:2,clientX:200,clientY:50,button:0,isPrimary:true,pointerType:'touch'}));
      window.dispatchEvent(new PointerEvent('pointerup',{pointerId:2,clientX:190,clientY:200}));
      check(carousel.index===0, `${count} imágenes: scroll vertical no cambia foto`);
    }
    carousel.destroy();
    check(!fixture.querySelector('.carousel-card'), `${count} imágenes: limpieza del componente`);
  }
  const single = create(1, 180);
  const firstCard = single.stage.querySelector('[data-position="0"]');
  await delay(1700);
  check(single.motion.matches || single.stage.querySelector('[data-position="0"]') !== firstCard, 'Una foto también se desplaza automáticamente');
  single.destroy();
  const animated = create(3,180);
  animated.move(1); animated.move(1);
  check(animated.index===(animated.motion.matches ? 2 : 1),'Transiciones simultáneas bloqueadas o instantáneas con movimiento reducido');
  await delay(240);
  animated.move(1);
  check(animated.index===(animated.motion.matches ? 0 : 2),'Nueva transición disponible al terminar');
  animated.destroy();
  const timed = create(3);
  await delay(1700);
  check(timed.motion.matches ? timed.index===0 : timed.index===1,'Autoplay respeta preferencia de movimiento del navegador');
  const next = timed.root.querySelector('[data-carousel="next"]');
  next.dispatchEvent(new PointerEvent('pointerenter',{pointerType:'mouse'}));
  const pausedIndex=timed.index;
  await delay(1650);
  check(timed.index===pausedIndex,'El puntero sobre la flecha detiene el temporizador');
  next.dispatchEvent(new PointerEvent('pointerleave',{pointerType:'mouse'}));
  await delay(2400);
  check(timed.index===pausedIndex,'La reproducción espera tres segundos al salir de la flecha');
  await delay(750);
  check(timed.motion.matches ? timed.index===pausedIndex : timed.index!==pausedIndex,'La reproducción se reanuda al salir de la flecha');
  const hoverIndex=timed.index;
  timed.root.dispatchEvent(new PointerEvent('pointerenter',{pointerType:'mouse'}));
  await delay(1650);
  check(timed.motion.matches ? timed.index===hoverIndex : timed.index!==hoverIndex,'Autoplay continúa con el ratón sobre la foto');
  const focusedIndex=timed.index;
  timed.root.focus();
  await delay(1650);
  check(timed.index===focusedIndex,'Foco de teclado detiene el temporizador');
  timed.root.blur();
  await delay(1650);
  check(timed.motion.matches ? timed.index===focusedIndex : timed.index!==focusedIndex,'Autoplay reanuda al salir del foco');
  timed.destroy();
  const matchMedia = window.matchMedia;
  const reducedQuery = Object.assign(new EventTarget(), { matches: true });
  window.matchMedia = query => query === '(prefers-reduced-motion: reduce)' ? reducedQuery : matchMedia.call(window, query);
  let reduced;
  try {
    reduced = create(3, 850);
    await delay(1650);
    check(reduced.index === 0, 'El movimiento reducido desactiva el autoplay');
    reduced.move(1, true);
    check(reduced.index === 1 && !reduced.busy, 'El movimiento reducido conserva la navegación manual instantánea');
  } finally {
    reduced?.destroy();
    window.matchMedia = matchMedia;
  }
} catch(error) { check(false,error.stack); }
document.querySelector('#summary').textContent=`${passes} comprobaciones correctas · ${failures} errores`;
</script></html>
